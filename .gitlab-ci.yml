stages:
  - deploy

workflow:
  auto_cancel:
    on_new_commit: interruptible

deploy-to-github:
  stage: deploy
  interruptible: true
  image:
    name: alpine/git:latest
    entrypoint: [""]
  tags:
    - generic
    - shared
    - docker
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
  before_script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - eval "$(ssh-agent -s)"
    - chmod 600 "$GITHUB_SSH_KEY"
    - ssh-add "$GITHUB_SSH_KEY"
    - ssh-keyscan github.com >> ~/.ssh/known_hosts
  script:
    - git remote add github git@github.com:8devices/meta-8dev.git || true
    - git push github "$CI_COMMIT_SHA:refs/heads/$CI_COMMIT_BRANCH"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(scarthgap|wrynose)$/
      when: manual
      allow_failure: true
