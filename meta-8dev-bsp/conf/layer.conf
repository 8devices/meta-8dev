# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# meta-qcom-hwe is optional. Recipes that hard-depend on it live under
# dynamic-layers/qcom-hwe and parse only when the qcom-hwe collection is present,
# so this layer parses cleanly without meta-qcom-hwe in bblayers.
BBFILES_DYNAMIC += " \
    qcom-hwe:${LAYERDIR}/dynamic-layers/qcom-hwe/*/*/*.bb \
    qcom-hwe:${LAYERDIR}/dynamic-layers/qcom-hwe/*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "8dev-bsp"
BBFILE_PATTERN_8dev-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_8dev-bsp = "6"

# qcom-hwe is intentionally not a LAYERDEPENDS (optional); gated via BBFILES_DYNAMIC.
LAYERDEPENDS_8dev-bsp = "core openembedded-layer qcom"
LAYERSERIES_COMPAT_8dev-bsp = "scarthgap"
