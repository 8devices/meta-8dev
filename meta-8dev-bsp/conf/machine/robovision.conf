#@TYPE: Machine
#@NAME: Robonode Vision
#@DESCRIPTION: Machine configuration for the 8devices Robonode Vision device.

require conf/machine/include/citron.inc

KERNEL_DEVICETREE = " \
    qcom/qcs6490-citron-robovision.dtb \
"

# Board DTB (not the multi-dtb default); drives dtb partition + flash map.
QCOM_DTB_DEFAULT = "qcs6490-citron-robovision"

# Fallback rootfs baked into the UKI; UEFI appends the active A/B slot as a later
# root= which the kernel prefers when present (last root= wins).
QCOM_BOOTIMG_ROOTFS = "PARTLABEL=system_a"

# DEBUG: earlycon to catch silent hangs between UEFI handoff and console init.
# uart5 (ttyMSM0) MMIO base on sc7280 is 0x994000. Remove once boot is clean.
KERNEL_CMDLINE_EXTRA:append = " earlycon=qcom_geni,mmio32,0x994000"

# efi: this board boots UEFI -> systemd-boot UKI from the ESP. Required for
# esp-qcom-image (guarded on the efi MACHINE_FEATURE) and the UKI boot path.
# The qcom base (qcom-common.inc) does not set it.
MACHINE_FEATURES:append = " \
    pci \
    wifi \
    usbhost \
    usbgadget \
    fastboot \
    edl \
    efi \
"

MACHINE_EXTRA_RRECOMMENDS:append = " \
    android-tools-adbd \
"
PREFERRED_PROVIDER_android-tools-conf = " \
    android-tools-conf-configfs \
"

# Wi-Fi is the external QCN9274 (ath12k): kernel driver (pulls cfg80211/mac80211/
# mhi via RDEPENDS) + firmware. Firmware is only the qcn9274 blob, not the ath12k
# umbrella (drags in unused WCN7850 blobs, ~15 MB).
MACHINE_EXTRA_RRECOMMENDS:append = " \
    kernel-module-ath12k \
    linux-firmware-ath12k-qcn9274 \
    linux-firmware-rtl8168 \
"

# Drop the userspace DSP stack (fastrpc, pd-mapper): no DSP/NPU compute, clients
# gone, kernel drivers+firmware also removed (see minimize.cfg).
# Drop NetworkManager: Ethernet-only board, systemd-networkd manages eth0/eth1;
# dropping nmcli cascades the daemon and its deps (libnm, dnsmasq) away.
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:remove = "fastrpc pd-mapper networkmanager-nmcli networkmanager-wifi"

# Keep kernel Image + DTBs out of the rootfs (~30 MB): boot is from the
# systemd-boot UKI in the ESP + dtb partition, so /boot copies are unused.
IMAGE_INSTALL:remove = "kernel-image kernel-devicetree"

INITRAMFS_IMAGE_BUNDLE = "1"
# wrynose meta-qcom removed initramfs-qcom-image; initramfs-rootfs-image is its
# successor (a minimal ramdisk that pivots into the real A/B rootfs).
INITRAMFS_IMAGE = "initramfs-rootfs-image"

# Qualcomm image-deploy class (qualcomm-linux meta-qcom renamed the old
# deploy_qcom to image_types_qcom; it provides the qcomflash type + ESP/DTB
# deploy vars). Add "qcomflash" to IMAGE_FSTYPES to emit the flashable tarball.
IMAGE_CLASSES += "image_types_qcom"
