#@TYPE: Machine
#@NAME: Citron
#@DESCRIPTION: Unified machine configuration for the 8devices Citron SOM based boards.

require conf/machine/include/citron.inc

KERNEL_DEVICETREE = " \
    qcom/qcs6490-citron-generic.dtb \
    qcom/qcs6490-citron-dvk.dtb \
    qcom/qcs6490-citron-dvk-rev2.dtb \
    qcom/qcs6490-citron-robovision.dtb \
    qcom/qcs6490-citron-robovision-rev2.dtb \
    qcom/qcs6490-citron-dvk-${CAMERA_DTBO}.dtbo \
    qcom/qcs6490-citron-robovision-${CAMERA_DTBO}.dtbo \
    qcom/qcs6490-citron-dvk-panel-waveshare-23448.dtbo \
    qcom/qcs6490-citron-robovision-panel-waveshare-23448.dtbo \
"

# Merged at build time so the boot firmware has no overlay to apply. rev2 boards
# reuse their base board's overlay; citron-generic breaks out no CSI port.
CAMERA_DTB_OVERLAYS = " \
    qcs6490-citron-dvk:qcs6490-citron-dvk-${CAMERA_DTBO} \
    qcs6490-citron-dvk-rev2:qcs6490-citron-dvk-${CAMERA_DTBO} \
    qcs6490-citron-robovision:qcs6490-citron-robovision-${CAMERA_DTBO} \
    qcs6490-citron-robovision-rev2:qcs6490-citron-robovision-${CAMERA_DTBO} \
"

MACHINE_FEATURES:append = " \
    pci \
    wifi \
"

MACHINE_EXTRA_RRECOMMENDS:append = " \
    kernel-module-ath12k \
    linux-firmware-ath12k-qcn9274 \
    linux-firmware-rtl8168 \
"

# Without it the DVK's gpio-usb-b-connectors never bind and dwc3-qcom leaves both
# ports in DEVICE role.
MACHINE_EXTRA_RRECOMMENDS:append = " \
    kernel-module-usb-conn-gpio \
"

# mac80211 request_module()s these at runtime for WPA. They are not link-time deps,
# so nothing else pulls them in and encrypted APs fail GTK install with ENOENT.
MACHINE_EXTRA_RRECOMMENDS:append = " \
    kernel-module-ccm \
    kernel-module-gcm \
    kernel-module-cmac \
"

# imx412 and qcom-camss already come from meta-qcom's machine-essential.
MACHINE_EXTRA_RRECOMMENDS:append = " kernel-module-ov9282 "

# DISP0 panel: udev binds both on modalias. msm and dispcc-sc7280 already come
# from meta-qcom's machine-essential packagegroup.
MACHINE_EXTRA_RRECOMMENDS:append = " \
    kernel-module-waveshare-dsi \
    kernel-module-panel-simple \
"

# For the DVK's extra media (UFS, SPI NAND, microSD) on top of the SOM's eMMC.
MACHINE_EXTRA_RRECOMMENDS:append = " \
    mtd-utils \
    mtd-utils-ubifs \
    util-linux-fdisk \
    util-linux-sfdisk \
    util-linux-blkid \
    e2fsprogs-mke2fs \
    e2fsprogs-e2fsck \
    e2fsprogs-resize2fs \
    dosfstools \
    mmc-utils \
"

# dmidecode reads the SMBIOS the UEFI/UKI path provides; modetest drives the DISP0
# panel without a desktop stack.
MACHINE_EXTRA_RRECOMMENDS:append = " dmidecode libdrm-tests"
