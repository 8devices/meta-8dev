# Cover normal operation, not just shutdown: without this a wedged PID 1 sat
# there until someone power-cycled the board.
#
# qcom-wdt barks at timeout - pretimeout and bites at timeout, so the bark
# panics with a ramoops backtrace and the bite is the backstop if the panic
# cannot finish. The bark is an ordinary interrupt: a hang that masks it where
# it lands gets the bite and no backtrace.
#
# systemd paces off the bark, not the bite, so PID 1 pings at half of
# (timeout - pretimeout) and a stall is caught at the bark, not the bite.
#
# RuntimeWatchdogPreSec is not self-checking: it needs the DT bark interrupt,
# CONFIG_WATCHDOG_PRETIMEOUT_GOV and CONFIG_WATCHDOG_SYSFS. Short any one and
# systemd logs "failed to read pretimeout governor" and this line does nothing.
[Manager]
RuntimeWatchdogSec=10s
RuntimeWatchdogPreSec=5s
