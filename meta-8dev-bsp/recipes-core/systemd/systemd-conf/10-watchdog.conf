# The apss watchdog is otherwise armed only across shutdown (RebootWatchdogSec,
# from WATCHDOG_TIMEOUT), leaving normal operation uncovered: a wedged PID 1 or
# a hung kernel sat there until someone power-cycled the board. PID 1 pings at
# half this interval, so 10s costs a ping every 5s and bounds a hang at 10s.
[Manager]
RuntimeWatchdogSec=10s
