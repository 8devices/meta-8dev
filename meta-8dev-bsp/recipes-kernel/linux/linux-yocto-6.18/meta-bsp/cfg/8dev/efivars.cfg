# UEFI variable access from Linux.
#
# Variables are not reachable through EFI runtime services on this platform -
# the firmware routes all runtime access through the qcom.tz.uefisecapp trusted
# application over SCM. qcom_qseecom_uefisecapp registers that as an efivars
# backend (CONFIG_QCOM_QSEECOM_UEFISECAPP in bsp/qcs6490/soc.cfg), which only
# surfaces as /sys/firmware/efi/efivars once efivarfs is available.
#
# Built in rather than =m: the FTM/calibration image is a fastbooted initramfs,
# and relying on a module being present and autoloaded there is a needless
# failure mode for something this small.
CONFIG_EFIVAR_FS=y
