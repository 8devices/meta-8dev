# SPDX-License-Identifier: MIT
# Qualcomm CAMSS MIPI-CSI camera pipeline for QCS6490 (sc7280):
#   camera clock controller + CCI I2C + CAMSS ISP + camera sensors.
# Sensors: Sony IMX577 (imx412 driver, "sony,imx577") on CSI0,
#          OmniVision OV9282 (ov9282 driver) on CSI1.
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
# MEDIA_SUPPORT_FILTER=y (uvc-camera.cfg) makes each media class opt-in, and
# MEDIA_PLATFORM_SUPPORT gates the whole drivers/media/platform tree (CAMSS).
CONFIG_MEDIA_PLATFORM_SUPPORT=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_VIDEO_DEV=y
CONFIG_MEDIA_PLATFORM_DRIVERS=y
CONFIG_V4L_PLATFORM_DRIVERS=y
CONFIG_VIDEO_V4L2_SUBDEV_API=y
CONFIG_V4L2_FWNODE=y
CONFIG_VIDEOBUF2_CORE=y
CONFIG_VIDEOBUF2_DMA_SG=y
CONFIG_SC_CAMCC_7280=m
CONFIG_I2C_QCOM_CCI=m
CONFIG_VIDEO_QCOM_CAMSS=m
CONFIG_VIDEO_IMX412=m
CONFIG_VIDEO_OV9282=m
