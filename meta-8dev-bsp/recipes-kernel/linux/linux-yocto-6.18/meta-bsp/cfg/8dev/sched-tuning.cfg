# Scheduler and thermal settings the QLI 2.0 reference enables and we did not.
# They matter here because the CAMX request manager works to a per-frame deadline.

# Otherwise per-frame camera IRQs and stream TX softirqs are charged to whatever
# task they preempted, so schedutil picks frequencies from a polluted signal.
CONFIG_IRQ_TIME_ACCOUNTING=y

# Lets latency-critical work get a frequency floor instead of the blunt global
# scaling_min_freq. Inert until something sets a clamp.
CONFIG_UCLAMP_TASK=y
CONFIG_UCLAMP_TASK_GROUP=y

# step_wise throttles in coarse steps once a trip is crossed; the power allocator
# budgets sustained load, which is what continuous 1080p30 encoding is.
CONFIG_THERMAL_GOV_POWER_ALLOCATOR=y

# Without an energy model the scheduler places tasks on capacity heuristics alone,
# and kernel.sched_energy_aware does not even exist, so EAS never ran on citron.
CONFIG_ENERGY_MODEL=y

# Creates cpu.max in the cgroup tree; urm's writes to system.slice/cpu.max fail
# without it.
CONFIG_CFS_BANDWIDTH=y

# urm's contextual classifier opens a NETLINK_CONNECTOR socket; without these it
# aborts server startup, silently losing the runtime half of urm while the
# boot-time policy still applies.
CONFIG_CONNECTOR=y
CONFIG_PROC_EVENTS=y
