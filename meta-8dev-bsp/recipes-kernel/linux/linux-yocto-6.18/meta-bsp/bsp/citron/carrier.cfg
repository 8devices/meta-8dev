# Citron carrier peripherals that are not on the SOM. One kernel serves every
# citron board, so these are always built; a board without the hardware simply
# has no DT node for the driver to bind.
#
# I2C_GPIO: the DVK's CSI4 sensor bus. GPIO161/162 have no CCI or QUP function on
# that carrier, so qcs6490-citron-dvk.dts bit-bangs the bus with i2c-gpio.
CONFIG_I2C_GPIO=y
# Power key: PHONE_ON wired to the PMK8350 KPD_PWR_N input (&pon_pwrkey) on the
# DVK, reported as KEY_POWER.
CONFIG_INPUT_PM8941_PWRKEY=y
# RGB status LED on Robonode Vision: three gpio-leds channels on gpio117/84/125.
# No trigger is enabled - the device tree leaves the channels off with no
# default-trigger, so they are driven from userspace through the LED class.
CONFIG_NEW_LEDS=y
CONFIG_LEDS_CLASS=y
CONFIG_LEDS_GPIO=y

# SPI NAND (DVK U19) is described but commented out in the device tree: the part
# reaches no real controller, so the bus must be bit-banged at ~42 KiB/s and a
# block-layer probe costs ~74 s, which blocks a udev worker and pushes module
# coldplug past the deferred-probe window. If the flash is ever moved to the QSPI
# controller, enable SPI_GPIO, MTD, MTD_SPI_NAND and MTD_BLOCK here together with
# uncommenting that node. Spelled out in prose rather than as commented options:
# do_kernel_configcheck reads "# CONFIG_FOO=y" as a badly formatted option, since
# fragment syntax reserves "# CONFIG_FOO is not set" for the disabled form.
