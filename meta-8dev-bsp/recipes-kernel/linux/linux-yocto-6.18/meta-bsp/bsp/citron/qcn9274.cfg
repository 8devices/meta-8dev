# MAC80211 comes from the ktype's wifi-common.
# ath12k select's QRTR as a module; the SoC's other QRTR users need it built in.
CONFIG_QRTR=y
CONFIG_QRTR_MHI=m
CONFIG_ATH12K=m
# ath12k_dbg() compiles into the RX/TX path, costing a branch per frame.
# CONFIG_ATH12K_DEBUG is not set
