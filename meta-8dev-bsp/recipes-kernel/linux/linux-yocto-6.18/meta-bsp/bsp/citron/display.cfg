# DISP0 (MIPI-DSI0) panel output: KMS + framebuffer console only. No GLES, no
# desktop stack - the panel's only consumer is fbcon, so nothing in userspace has
# to run for the boot logo and the kernel log to appear on it.
#
# DRM and DRM_MSM stay modules, matching the wrynose fragment this came from. The
# reason there was the camx kgsl-dlkm needing msm loadable; that stack does not
# exist on this branch, but modules keep the base kernel small and let udev bind
# the panel and bridge on modalias. The interfaces below are bool symbols
# compiled into that module.
CONFIG_DRM=m
CONFIG_DRM_MSM=m
CONFIG_DRM_MSM_DPU=y
CONFIG_DRM_MSM_DSI=y
CONFIG_DRM_MSM_DSI_7NM_PHY=y
CONFIG_SC_DISPCC_7280=m

# The Waveshare panel assembly is an I2C DSI-to-DPI bridge board driving a dumb
# DPI panel, described by a panel-timing in DT ("panel-dpi" -> panel-simple).
# Both drivers depend on BACKLIGHT_CLASS_DEVICE: the bridge exposes the panel
# backlight as a backlight device and dims it over I2C.
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_DRM_WAVESHARE_BRIDGE=m
CONFIG_DRM_PANEL_SIMPLE=m

# Framebuffer console on the DRM device + the boot logo. FB provides FB_CORE that
# fbcon and LOGO need, VT the console layer fbcon binds to.
CONFIG_FB=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_LOGO=y
CONFIG_LOGO_LINUX_CLUT224=y
