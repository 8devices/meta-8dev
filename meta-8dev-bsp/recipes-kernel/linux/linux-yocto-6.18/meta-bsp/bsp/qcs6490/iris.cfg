# SPDX-License-Identifier: MIT
# iris-video-dlkm supports UBWC, giving a zero-copy CAMX-ISP -> encode path; it
# blacklists venus/vidc at runtime, so mainline Venus is built only for its selects.

# iris_vpu.ko uses the sync_file API.
CONFIG_SYNC_FILE=y

# Without it qcom_ubwc_config_get_data() returns the -EOPNOTSUPP stub and iris
# probe fails. Promptless, hence patches/qcom-ubwc-config-selectable.patch.
CONFIG_QCOM_UBWC_CONFIG=y

# The base build strips SUSPEND, which leaves the driver's PM callbacks unused and
# fails the module build on -Werror=unused-function.
CONFIG_SUSPEND=y
