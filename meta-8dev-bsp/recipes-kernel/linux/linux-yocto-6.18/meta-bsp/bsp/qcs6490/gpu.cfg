# Adreno GPU for the camx build. The GPU itself runs on the proprietary KGSL
# driver, but kgsl-dlkm loads "msm skip_gpu=1", so DRM_MSM is still needed for KMS.
CONFIG_DRM_MSM_GPU_STATE=y
CONFIG_SC_GPUCC_7280=m

# kgsl-dlkm links against interval_tree_*, which is promptless upstream - hence
# patches/interval-tree-selectable.patch.
CONFIG_INTERVAL_TREE=y

# The DPU is here as a GBM allocator, not for a screen: the imsdk ML elements need
# GLES -> EGL/GBM -> a DRM card0, and skip_gpu leaves the DPU as the only publisher.
# Its component master needs at least one interface or it NULL-derefs, and external
# DP is the only one that binds with nothing downstream.
CONFIG_DRM_MSM_DP=y
# CONFIG_DRM_MSM_MDP4 is not set
# CONFIG_DRM_MSM_MDP5 is not set
# CONFIG_DRM_MSM_HDMI is not set
