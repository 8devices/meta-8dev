# Built-in (not =m) so the usb_gadget configfs group exists at boot without an
# explicit modprobe -- matches ktypes/8dev/standard.cfg and the qcs40x/tobufi
# kernel. The gadget functions below stay modular (loaded on demand when linked).
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_ACM=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_ECM_SUBSET=y
CONFIG_USB_CONFIGFS_EEM=y
CONFIG_USB_CONFIGFS_F_FS=y
CONFIG_USB_CONFIGFS_MASS_STORAGE=y
CONFIG_USB_CONFIGFS_NCM=y
CONFIG_USB_CONFIGFS_OBEX=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_CONFIGFS_SERIAL=y
# Functions are built-in: with USB_CONFIGFS=y the CONFIGFS_* options above
# select them built-in, so =m would not be assignable (kernel config audit).
CONFIG_USB_F_ACM=y
CONFIG_USB_F_ECM=y
CONFIG_USB_F_EEM=y
CONFIG_USB_F_FS=y
CONFIG_USB_F_MASS_STORAGE=y
CONFIG_USB_F_NCM=y
CONFIG_USB_F_OBEX=y
CONFIG_USB_F_RNDIS=y
CONFIG_USB_F_SERIAL=y
CONFIG_USB_F_SUBSET=y
CONFIG_USB_MASS_STORAGE=y
CONFIG_USB_U_ETHER=y
CONFIG_USB_U_SERIAL=y
