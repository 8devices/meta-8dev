# QCS404 DWMAC QCOM ETHQOS additions
# (upstream stmmac.scc provides STMMAC_ETH, STMMAC_PLATFORM, STMMAC_PCI)
CONFIG_DWMAC_GENERIC=y
CONFIG_DWMAC_QCOM_ETHQOS=y
CONFIG_PHYLIB=y
CONFIG_AT803X_PHY=y
CONFIG_FIXED_PHY=y
CONFIG_PTP_1588_CLOCK=y

# Not applicable — QCS404 uses platform ETHQOS, not PCI or IPQ806x
# CONFIG_STMMAC_PCI is not set
# CONFIG_DWMAC_IPQ806X is not set
