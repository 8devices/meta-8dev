# SPDX-License-Identifier: MIT
# QCS404 SoC core hardware configuration

# Platform
CONFIG_ARCH_QCOM=y
CONFIG_NR_CPUS=4

# Clocks
CONFIG_QCOM_GDSC=y
CONFIG_QCOM_RPMCC=y
CONFIG_COMMON_CLK_QCOM=y
CONFIG_QCOM_CLK_APCS_MSM8916=y
CONFIG_QCOM_CLK_SMD_RPM=y
CONFIG_QCS_GCC_404=y
CONFIG_QCS_TURING_404=y
CONFIG_QCS_Q6SSTOP_404=y
CONFIG_QCOM_HFPLL=y

# Pinctrl
CONFIG_PINCTRL_MSM=y
CONFIG_PINCTRL_QCS404=y
CONFIG_PINCTRL_QCOM_SPMI_PMIC=y

# Interconnect
CONFIG_INTERCONNECT=y
CONFIG_INTERCONNECT_QCOM=y
CONFIG_INTERCONNECT_QCOM_QCS404=y
CONFIG_INTERCONNECT_QCOM_SMD_RPM=y

# RPM / Power
CONFIG_QCOM_SMD_RPM=y
CONFIG_QCOM_RPMPD=y
CONFIG_QCOM_SCM=y
CONFIG_QCOM_SMEM=y
CONFIG_QCOM_SMP2P=y
CONFIG_QCOM_SMSM=y
CONFIG_QCOM_CPR=y
CONFIG_POWER_RESET=y
CONFIG_POWER_RESET_MSM=y
CONFIG_POWER_RESET_QCOM_PON=y

# PMIC / SPMI
CONFIG_SPMI=y
CONFIG_SPMI_MSM_PMIC_ARB=y
CONFIG_MFD_SPMI_PMIC=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_VOLTAGE=y
CONFIG_REGULATOR_QCOM_SMD_RPM=y
CONFIG_REGULATOR_QCOM_SPMI=y

# ADC / Thermal sensors
CONFIG_THERMAL=y
CONFIG_IIO=y
CONFIG_QCOM_SPMI_VADC=y
CONFIG_QCOM_SPMI_ADC5=y
CONFIG_QCOM_TSENS=y
CONFIG_QCOM_SPMI_ADC_TM5=y
CONFIG_QCOM_SPMI_TEMP_ALARM=y

# IOMMU
CONFIG_ARM_SMMU=y
CONFIG_ARM_SMMU_QCOM=y
CONFIG_QCOM_IOMMU=y

# Crypto HW
CONFIG_CRYPTO_DEV_QCE=y
CONFIG_CRYPTO_DEV_QCOM_RNG=y

# HW RNG
CONFIG_HW_RANDOM=y
CONFIG_HW_RANDOM_ARM_SMCCC_TRNG=y
# CONFIG_HW_RANDOM_CN10K is not set

# Remoteproc
CONFIG_REMOTEPROC=y
CONFIG_QCOM_Q6V5_PAS=m
CONFIG_QCOM_SYSMON=m

# RPMSG / GLINK
CONFIG_RPMSG_QCOM_GLINK=y
CONFIG_RPMSG_QCOM_GLINK_RPM=y
CONFIG_RPMSG_QCOM_GLINK_SMEM=y
CONFIG_RPMSG_QCOM_SMD=y

# QRTR
CONFIG_QRTR=y
CONFIG_QRTR_SMD=y
CONFIG_QRTR_MHI=m

# Serial (MSM UARTDM)
CONFIG_SERIAL_MSM=y
CONFIG_SERIAL_MSM_CONSOLE=y

# I2C (QUP)
CONFIG_I2C_QUP=y

# SPI (QUP)
CONFIG_SPI_QUP=y

# MMC (SDHCI MSM)
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PLTFM=y
CONFIG_MMC_SDHCI_MSM=y
CONFIG_MMC_CQHCI=y
# Not applicable — requires ACPI (x86 only)
# CONFIG_MMC_SDHCI_ACPI is not set

# PCIe
CONFIG_PCIE_QCOM=y

# DMA (BAM)
CONFIG_DMADEVICES=y
CONFIG_QCOM_BAM_DMA=y

# Watchdog
CONFIG_QCOM_WDT=y

# IRQ chips
CONFIG_QCOM_PDC=y
CONFIG_QCOM_MPM=y

# Mailbox
CONFIG_MAILBOX=y
CONFIG_QCOM_APCS_IPC=y

# HW Spinlock
CONFIG_HWSPINLOCK=y
CONFIG_HWSPINLOCK_QCOM=y

# MHI
CONFIG_MHI_BUS=m

# SoC drivers
CONFIG_QCOM_SOCINFO=y
CONFIG_QCOM_STATS=y
CONFIG_QCOM_RMTFS_MEM=y
CONFIG_QCOM_FASTRPC=m
# Not applicable to QCS404
# CONFIG_QCOM_EBI2 is not set

# NVMEM
CONFIG_NVMEM=y
CONFIG_NVMEM_QCOM_QFPROM=y

# PHY (PCIe)
CONFIG_PHY_QCOM_PCIE2=y

# Power key (PMIC)
CONFIG_INPUT_PM8941_PWRKEY=y

# RTC (PMIC)
CONFIG_RTC_DRV_PM8XXX=y

# CPU frequency
CONFIG_ARM_QCOM_CPUFREQ_NVMEM=y
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_STAT=y
CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y

# CPU idle (PSCI — standard ARM64 idle driver)
CONFIG_ARM_PSCI_CPUIDLE=y

# Multi-core scheduling
CONFIG_SCHED_MC=y

# Devfreq
CONFIG_PM_DEVFREQ=y
CONFIG_DEVFREQ_GOV_SIMPLE_ONDEMAND=y

# CMA (needed for DMA on ARM64)
CONFIG_CMA=y
CONFIG_DMA_CMA=y

# Thermal cooling (ties thermal zones to cpufreq)
CONFIG_CPU_THERMAL=y
CONFIG_DEVFREQ_THERMAL=y
CONFIG_THERMAL_NETLINK=y
