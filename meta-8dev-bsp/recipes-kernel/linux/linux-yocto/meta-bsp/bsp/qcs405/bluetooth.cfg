# SPDX-License-Identifier: MIT
# QCS404 Bluetooth — full override (no upstream bluetooth.scc)
# Replaces features/bluetooth/bluetooth.scc to avoid pulling in
# 6lowpan.scc (which enables CONFIG_IPV6=y and CONFIG_6LOWPAN=m).

# Core Bluetooth
CONFIG_BT=y
CONFIG_BT_BREDR=y
CONFIG_BT_LE=y
CONFIG_BT_RFCOMM=m
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=m
CONFIG_BT_BNEP_MC_FILTER=y
CONFIG_BT_BNEP_PROTO_FILTER=y
CONFIG_BT_LE_L2CAP_ECRED=y
CONFIG_BT_DEBUGFS=y

# QCA UART HCI transport
CONFIG_SERIAL_DEV_BUS=y
CONFIG_BT_QCA=m
CONFIG_BT_HCIUART=m
CONFIG_BT_HCIUART_SERDEV=y
CONFIG_BT_HCIUART_H4=y
CONFIG_BT_HCIUART_QCA=y
