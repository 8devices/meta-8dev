PACKAGE_CLASSES ?= "package_ipk"

require conf/distro/poky.conf
require conf/distro/include/qcom-exclude-features.inc

# Ubuntu 26.04 validated as a build host by 8devices; silence poky's
# untested-host sanity warning. Entries are "\n"-separated (see sanity.bbclass).
SANITY_TESTED_DISTROS:append = " ubuntu-26.04 \n"

DISTRO = "8dev-basic"
DISTRO_NAME = "8devices basic distro"
MAINTAINER = "8devices <support@8devices.com>"
SDK_VENDOR = "-8devsdk"
TARGET_VENDOR = "-8dev"

# vulkan is unusable here: libvulkan_adreno needs an X11 WSI these headless boards lack.
DISTRO_FEATURES:remove = "3g nfc pcmcia debuginfod gobject-introspection-data ldconfig x11 nfs zeroconf alsa bluetooth vulkan"

CAMERA_STACK ??= "camss"
require conf/distro/include/camera-stack-${CAMERA_STACK}.inc

POKY_DEFAULT_DISTRO_FEATURES = ""
POKY_INIT_MANAGER = "systemd"
POKY_INIT_MANAGER:libc-musl = "sysvinit"

# journald is the only logger on these headless boards; drop BusyBox syslogd/klogd.
VIRTUAL-RUNTIME_base-utils-syslog = ""

# The H.264 path the video-streaming packagegroups ship.
LICENSE_FLAGS_ACCEPTED:append = " \
    commercial_openh264 \
    commercial_ffmpeg \
    commercial_gstreamer1.0-libav \
    commercial_x264 \
    commercial_gstreamer1.0-plugins-ugly \
"

# ~17M vendor-name database, dead weight on fixed hardware.
BAD_RECOMMENDATIONS:append = " udev-hwdb"

IMAGE_INSTALL:append = " packagegroup-basic-core"

# Enable additional image features. wrynose removed the "debug-tweaks" meta
# feature; use its constituent features directly (allow root/empty-password
# login + postinst logging) for these bring-up/debug images.
EXTRA_IMAGE_FEATURES += "\
    ssh-server-openssh \
    allow-empty-password \
    allow-root-login \
    empty-root-password \
    post-install-logging \
    system-debug \
    network-debug \
    update-tools \
"
