PACKAGE_CLASSES ?= "package_ipk"

require conf/distro/poky.conf
require conf/distro/include/qcom-exclude-features.inc

# Ubuntu 26.04 validated as a build host by 8devices; silence poky's
# untested-host sanity warning. Entries are "\n"-separated (see sanity.bbclass).
SANITY_TESTED_DISTROS:append = " ubuntu-26.04 \n"

PREFERRED_VERSION_swupdate ?= "2025.05"

DISTRO = "8dev-basic"
DISTRO_NAME = "8devices basic distro"
MAINTAINER = "8devices <support@8devices.com>"
SDK_VENDOR = "-8devsdk"
TARGET_VENDOR = "-8dev"

# Remove unused distro features
DISTRO_FEATURES:remove = "3g nfc pcmcia debuginfod gobject-introspection-data ldconfig x11 nfs zeroconf alsa bluetooth"

POKY_DEFAULT_DISTRO_FEATURES = ""
POKY_INIT_MANAGER = "systemd"
POKY_INIT_MANAGER:libc-musl = "sysvinit"

# systemd-binfmt is the registrar for binfmt_misc: it reads binfmt.d and tells
# the kernel which interpreter runs a format it has no loader for. The kernel
# half is a machine feature, so every board here already has it; without the
# registrar in the image a binfmt.d file is just a file.
IMAGE_INSTALL:append = " packagegroup-basic-core systemd-binfmt"

# Enable additional image features
EXTRA_IMAGE_FEATURES += "\
    ssh-server-openssh \
    debug-tweaks \
    system-debug \
    network-debug \
    update-tools \
"
