BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "8dev-basic"
BBFILE_PATTERN_8dev-basic = "^${LAYERDIR}/"
BBFILE_PRIORITY_8dev-basic = "6"

LAYERDEPENDS_8dev-basic = "core networking-layer openembedded-layer multimedia-layer qcom swupdate"
LAYERSERIES_COMPAT_8dev-basic = "wrynose"
