# IMX577 soft-ISP tuning.
#
# The CCM below is ported from the Raspberry Pi imx477 tuning (same Sony die),
# but is DISABLED: the mainline soft ISP's AWB is unreliable on the sc7280 CAMSS
# raw path, and applying this CCM to a mis-white-balanced frame produces a strong
# magenta cast (verified far worse than the identity CCM). Re-enable it only once
# AWB is trustworthy (or after a board-specific re-tune with fixed WB gains).
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  # - Ccm:
  #     ccms:
  #       - ct: 2850
  #         ccm: [ 1.97469, -0.71439, -0.26031, -0.43521, 2.09769, -0.66248, -0.04826, -0.84642, 1.89468 ]
  #       - ct: 2960
