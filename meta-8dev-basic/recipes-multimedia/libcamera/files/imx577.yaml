  #       - ct: 3580
  #         ccm: [ 2.03422, -0.80048, -0.23374, -0.39089, 1.97221, -0.58132, -0.08969, -0.61439, 1.70408 ]
  #       - ct: 4559
  #         ccm: [ 2.15423, -0.98143, -0.17279, -0.38131, 2.14763, -0.76632, -0.10069, -0.54383, 1.64452 ]
  #       - ct: 5881
  #         ccm: [ 2.18464, -0.95493, -0.22971, -0.36826, 2.00298, -0.63471, -0.15219, -0.38055, 1.53274 ]
  #       - ct: 7600
