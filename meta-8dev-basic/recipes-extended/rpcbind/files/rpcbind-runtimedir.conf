# Fix rpcbind aborting at boot with "/var/run/rpcbind.lock: No such file or
# directory". Stock rpcbind.service has no ordering, so socket activation starts
# it before systemd-tmpfiles brings up /run. After=basic.target delays it until
# the runtime tree exists (After=local-fs.target alone was NOT enough).
# RuntimeDirectory=rpcbind provides the /run/rpcbind dir that rpcbind -w uses.
[Unit]
After=basic.target

[Service]
RuntimeDirectory=rpcbind
RuntimeDirectoryMode=0755
