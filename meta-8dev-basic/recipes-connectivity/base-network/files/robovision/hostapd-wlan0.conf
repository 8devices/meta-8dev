# wlan0 = phy0 (2.4 GHz). 802.11ax (HE) + 802.11n (HT) AP, 20 MHz, bridged into br0.
# 2.4 GHz stays 20 MHz: HT40 there overlaps the only 3 non-overlapping channels.
interface=wlan0
bridge=br0
driver=nl80211
ctrl_interface=/var/run/hostapd

country_code=US
ieee80211d=1

hw_mode=g
channel=6
ieee80211n=1
ht_capab=[SHORT-GI-20]
ieee80211ax=1
he_oper_chwidth=0
wmm_enabled=1

ssid=robovision
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=passphrase
