# wlan1 = phy1 (5 GHz). 802.11ax (HE) + 802.11ac (VHT), 80 MHz, bridged into br0.
# Channel 36 is non-DFS (UNII-1) so the AP starts without radar-detect delay.
interface=wlan1
bridge=br0
driver=nl80211
ctrl_interface=/var/run/hostapd

country_code=US
ieee80211d=1
ieee80211h=1

hw_mode=a
channel=36
ieee80211n=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
ieee80211ac=1
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=42
vht_capab=[RXLDPC][SHORT-GI-80]
ieee80211ax=1
he_oper_chwidth=1
he_oper_centr_freq_seg0_idx=42
wmm_enabled=1

ssid=robovision
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=passphrase
