# radioN=<device syspath>[ <phy index>]
# The QCN9274's two PHYs share one PCIe function, so the trailing index
# disambiguates them. A single-PHY card has radio0 only.
radio0=/sys/devices/platform/soc@0/1c08000.pcie/pci0001:00/0001:00:00.0/0001:01:00.0 0
radio1=/sys/devices/platform/soc@0/1c08000.pcie/pci0001:00/0001:00:00.0/0001:01:00.0 1
